name: CI DevOps

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build et tests Maven
        run: mvn -B clean package

      - name: Executer l'application
        run: java -jar target/pipeline-demo-1.0-SNAPSHOT.jar

      - name: Construire l'image Docker
        run: docker build -t pipeline-demo:ci .